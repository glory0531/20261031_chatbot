name: Publish ShaBot Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root production dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Install client dependencies & build production UI
        run: |
          npm --prefix client install --no-audit --no-fund
          npm --prefix client run build

      - name: Package Portable & OTA Update ZIPs
        shell: pwsh
        run: |
          $tagVer = "${{ github.ref_name }}".TrimStart("v")
          if ([string]::IsNullOrWhiteSpace($tagVer) -or $tagVer -eq "main") {
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $tagVer = $pkg.version
          }
          node scripts/publishRelease.js --ci --version=$tagVer --repo=${{ github.repository }}

      - name: Publish GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "🍪 오픈 샤봇 ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist-release/ShaBot-Portable-*.zip
            dist-release/ShaBot-Update-*.zip
            dist-release/manifest.json

